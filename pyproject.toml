[build-system]
requires = ["setuptools>=61", "wheel", "cython>=3.0", "numpy>=1.22"]
build-backend = "setuptools.build_meta"

[project]
name = "opid"
version = "0.2.0"
description = "Operator Identification from PDE trajectory data"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.8",
    "scikit-learn>=1.1",
]

[project.optional-dependencies]
milp = ["cvxpy>=1.3"]
fftw = [
    "sympy>=1.12",
    "jinja2>=3.0",
    "cython>=3.0",
]
all = ["opid[milp,fftw]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["opid*"]

# Include non-Python source files so they are present in sdists and
# installed packages (needed by SpectralEngine compilation at runtime
# and by the Cython build).
[tool.setuptools.package-data]
"opid._backend.src"       = ["*.h"]
"opid._backend.templates" = ["*.cpp"]
"opid._bspline"           = ["*.pyx", "*.c", "*.h", "*.so", "*.pyd"]
"opid.src"                = ["*.h"]
